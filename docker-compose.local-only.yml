# Local-only mode: the gateway cannot reach the internet and accepts only
# models served inside the compose network. Enable it permanently in .env:
#   PRIVACY_HUB_LOCAL_ONLY=true
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local-only.yml
#   COMPOSE_PROFILES=local-llm
# then: docker compose down && docker compose up -d
# (Running a later "docker compose ..." command WITHOUT this file would
# recreate the gateway in normal mode; COMPOSE_FILE in .env prevents that.)
#
# * The gateway's "egress" network becomes internal, like the networks of
#   Open WebUI, the OCR service, the analyzer and the databases.
# * PRIVACY_HUB_LOCAL_ONLY=true: the gateway drops model entries that would
#   call an external provider and refuses to start if one remains.
# Only nginx stays on the "frontend" network, which is not internal (Docker
# cannot publish ports on internal networks); it forwards only to fixed
# internal services.
services:
  litellm:
    environment:
      PRIVACY_HUB_LOCAL_ONLY: "true"

networks:
  egress:
    internal: true
