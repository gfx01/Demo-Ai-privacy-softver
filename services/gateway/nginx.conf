# Public entry point. LiteLLM is NOT published on the host; only the routes
# below reach it. Everything else goes to the portal (which 404s unknown
# paths). LiteLLM pass-through routes (/openai/*, /anthropic/*, /gemini/*,
# /vertex_ai/*, ...), /v1/embeddings, /v1/responses, /v1/messages, files,
# audio, images, MCP, admin/management APIs and the LiteLLM UI are therefore
# unreachable from outside: their payloads are not covered by the guardrail.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Access log without query strings or bodies.
  log_format privacy '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout privacy;
  error_log /dev/stderr warn;

  client_max_body_size 4m;
  limit_req_zone $binary_remote_addr zone=llm:10m rate=10r/s;
  # Preview runs PII detection (CPU) without auth to LiteLLM first; admin
  # uses Basic auth (slow down password guessing).
  limit_req_zone $binary_remote_addr zone=preview:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
  limit_req_status 429;

  upstream litellm { server litellm:4000; }
  upstream portal  { server portal:8000; }

  server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Locations match the normalised path; refuse anything that only
    # normalises to an allowed path (dot segments, encoded dots, slashes or
    # backslashes) instead of trusting every upstream to normalise the same way.
    if ($request_uri ~ "^[^?]*(/\.|%2[eEfF]|%5[cC]|\\\\)") { return 400; }

    # --- LLM API allowlist (exact matches only) ----------------------------
    location = /v1/chat/completions { limit_req zone=llm burst=20 nodelay; include /etc/nginx/llm_proxy.conf; proxy_pass http://litellm/v1/chat/completions; }
    location = /chat/completions    { limit_req zone=llm burst=20 nodelay; include /etc/nginx/llm_proxy.conf; proxy_pass http://litellm/v1/chat/completions; }
    location = /v1/models           { proxy_pass http://litellm/v1/models; }
    location = /models              { proxy_pass http://litellm/v1/models; }

    # --- everything else: portal (landing, chat with preview, admin) -------
    location = /api/preview { limit_req zone=preview burst=10 nodelay; proxy_pass http://portal; }
    location /admin { limit_req zone=admin burst=30 nodelay; proxy_pass http://portal; }
    location / {
      proxy_pass http://portal;
      proxy_read_timeout 120s;
    }
  }
}
