# Shared settings for streamed LLM responses. proxy_pass is set per location
# with an explicit URI, so the raw client path never reaches LiteLLM.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
chunked_transfer_encoding on;
# Chat requests may carry images and files inline (base64), which the
# gateway turns into text (OCR) before masking: 20 MB of attachments plus
# base64 overhead.
client_max_body_size 28m;
