[project]
name = "privacy-hub"
version = "0.1.0"
description = "AI privacy hub MVP: reversible PII masking guardrail for LiteLLM (Hungarian + English)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Runtime deps of the core package. All of them are already present in the
# pinned litellm/litellm image, so the gateway image needs no extra installs.
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
  "redis>=5",
  "psycopg>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the running docker compose stack (make up)",
  "analyzer: needs presidio/spacy installed (analyzer venv)",
  "gateway: needs litellm installed (gateway venv)",
]
addopts = "-ra"
