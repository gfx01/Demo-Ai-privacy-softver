# AI Privacy Hub - self-hosted demo stack.
#   ./scripts/init-env.sh        # creates .env with random secrets
#   docker compose up -d --build
# Gateway (chat + admin + OpenAI-compatible API): http://localhost:8080
# Open WebUI:                                     http://localhost:3000
name: privacy-hub

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *defaults
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?}
      PH_GATEWAY_DB_PASSWORD: ${PH_GATEWAY_DB_PASSWORD:?}
      PH_PORTAL_DB_PASSWORD: ${PH_PORTAL_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/schema:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d privacyhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  redis:
    <<: *defaults
    image: redis:7.4.11-alpine
    # No persistence: encrypted mappings live in memory only, with a TTL.
    command: >
      redis-server --save "" --appendonly no --maxmemory 64mb
      --maxmemory-policy volatile-ttl --requirepass "${REDIS_PASSWORD:?}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [data]

  analyzer:
    <<: *defaults
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    image: privacy-hub/analyzer:dev
    environment:
      ANALYZER_API_TOKEN: ${ANALYZER_API_TOKEN:?}
      ANALYZER_LANGUAGES: ${ANALYZER_LANGUAGES:-hu,en}
      ANALYZER_HU_NER: ${ANALYZER_HU_NER:-none}
      ANALYZER_WORKERS: ${ANALYZER_WORKERS:-1}
      PRIVACY_HUB_PSEUDONYM_KEY: ${PRIVACY_HUB_PSEUDONYM_KEY:?}
    read_only: true
    tmpfs: [/tmp]
    networks: [analysis]

  # Text from uploaded documents and chat images (PDF, scans, photos, DOCX,
  # XLSX). Internal networks only: no internet access. Open WebUI and the
  # gateway reach it on two separate networks, so Open WebUI cannot reach
  # LiteLLM directly (only through nginx).
  ocr:
    <<: *defaults
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
      args:
        OCR_WITH_SURYA: ${OCR_WITH_SURYA:-0}
    image: privacy-hub/ocr:dev
    environment:
      OCR_API_KEY: ${OCR_API_KEY:?run scripts/init-env.sh --add-missing}
      # tesseract (default, Apache-2.0 models) | surya (needs OCR_WITH_SURYA=1,
      # the surya-vlm GPU service and a weights licence, see docs/LIMITATIONS.md)
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_SURYA_LICENSE_ACCEPTED: ${OCR_SURYA_LICENSE_ACCEPTED:-false}
      SURYA_INFERENCE_URL: ${SURYA_INFERENCE_URL:-}
      SURYA_INFERENCE_BACKEND: vllm
      VLLM_API_KEY: ${SURYA_VLM_API_KEY:-}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      OCR_TIMEOUT_S: ${OCR_TIMEOUT_S:-180}
    read_only: true
    tmpfs: [/tmp]
    # Untrusted files are parsed here; an extraction that runs out of memory
    # is killed and restarted without affecting the other services.
    mem_limit: ${OCR_MEM_LIMIT:-4g}
    networks: [ocr-ui, ocr-gateway, ocr-model]

  mock-llm:
    <<: *defaults
    build:
      context: .
      dockerfile: services/mock_llm/Dockerfile
    image: privacy-hub/mock-llm:dev
    environment:
      MOCK_LLM_INSPECT_TOKEN: ${MOCK_LLM_INSPECT_TOKEN:?}
    read_only: true
    tmpfs: [/tmp]
    networks: [providers]

  litellm:
    <<: *defaults
    build:
      context: .
      dockerfile: services/litellm/Dockerfile
    image: privacy-hub/litellm:dev
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      MOCK_LLM_API_KEY: mock-not-a-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PRIVACY_HUB_ANALYZER_URL: http://analyzer:8000
      PRIVACY_HUB_ANALYZER_TOKEN: ${ANALYZER_API_TOKEN}
      PRIVACY_HUB_MAPPING_KEY: ${PRIVACY_HUB_MAPPING_KEY:?}
      PRIVACY_HUB_STORE_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PRIVACY_HUB_DATABASE_URL: postgresql://ph_gateway:${PH_GATEWAY_DB_PASSWORD}@postgres:5432/privacyhub
      PRIVACY_HUB_DEFAULT_LANGUAGE: ${PRIVACY_HUB_DEFAULT_LANGUAGE:-hu}
      PRIVACY_HUB_MAPPING_TTL_S: ${PRIVACY_HUB_MAPPING_TTL_S:-300}
      PRIVACY_HUB_EXTRA_ALLOWED_PARAMS: ${PRIVACY_HUB_EXTRA_ALLOWED_PARAMS:-}
      PRIVACY_HUB_AUDIT_REQUIRED: "true"
      # Chat images and files are turned into text here, then masked.
      PRIVACY_HUB_OCR_URL: http://ocr:8000
      PRIVACY_HUB_OCR_TOKEN: ${OCR_API_KEY}
      PRIVACY_HUB_OCR_TIMEOUT_S: ${OCR_TIMEOUT_S:-180}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:?run scripts/init-env.sh --add-missing}
      # true: refuse every model outside the compose network (see
      # docker-compose.local-only.yml, which also cuts internet access)
      PRIVACY_HUB_LOCAL_ONLY: ${PRIVACY_HUB_LOCAL_ONLY:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      analyzer: { condition: service_healthy }
      ocr: { condition: service_healthy }
      mock-llm: { condition: service_started }
    networks: [data, analysis, providers, ocr-gateway, internal, egress]

  portal:
    <<: *defaults
    build:
      context: .
      dockerfile: services/portal/Dockerfile
    image: privacy-hub/portal:dev
    environment: &portal-env
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PRIVACY_HUB_ANALYZER_URL: http://analyzer:8000
      PRIVACY_HUB_ANALYZER_TOKEN: ${ANALYZER_API_TOKEN}
      PORTAL_DATABASE_URL: postgresql://ph_portal:${PH_PORTAL_DB_PASSWORD}@postgres:5432/privacyhub
      PORTAL_ADMIN_USER: ${PORTAL_ADMIN_USER:-admin}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?}
      PUBLIC_OPENWEBUI_URL: ${PUBLIC_OPENWEBUI_URL:-http://localhost:3000}
      PRIVACY_HUB_DEFAULT_ORG: default
      PROVIDER_MODELS: ${PROVIDER_MODELS:-}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data, analysis, internal]

  bootstrap:
    image: privacy-hub/portal:dev
    command: ["python", "-m", "portal.bootstrap"]
    restart: "no"
    environment:
      <<: *portal-env
      # Only the one-shot bootstrap job registers the Open WebUI key.
      OPENWEBUI_LITELLM_KEY: ${OPENWEBUI_LITELLM_KEY:?}
    depends_on:
      litellm: { condition: service_healthy }
      portal: { condition: service_started }
    networks: [internal]

  gateway:
    <<: *defaults
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/llm_proxy.conf:/etc/nginx/llm_proxy.conf:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      # nginx resolves upstreams at start: restart it when they are recreated
      litellm: { condition: service_healthy, restart: true }
      portal: { condition: service_healthy, restart: true }
    networks: [internal, frontend]

  openwebui:
    <<: *defaults
    image: openwebui/open-webui:0.12.3-slim
    ports:
      - "127.0.0.1:${OPENWEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: http://gateway:8080/v1
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?}
      ENABLE_OLLAMA_API: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # Everything must go through the privacy gateway: no local models, no
      # web search, no downloads, documents are sent as (masked) chat context.
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      # Uploaded files go to the internal OCR service; their text then travels
      # in the chat request and is masked by the gateway. Chat images are
      # sent as images and turned into text by the gateway.
      CONTENT_EXTRACTION_ENGINE: external
      EXTERNAL_DOCUMENT_LOADER_URL: http://ocr:8000
      EXTERNAL_DOCUMENT_LOADER_API_KEY: ${OCR_API_KEY}
      CONTENT_EXTRACTION_SUPPORTED_MEDIA_MIME_TYPES: image/png,image/jpeg,image/tiff,image/webp,image/gif,image/bmp
      # Settings come from this file only; an older value stored in Open
      # WebUI's database (e.g. an empty extraction engine) would win otherwise.
      # Changes made in the admin UI last until the next restart, so the
      # hardening below must be set here: self-registration stays off (the
      # first admin account can still be created) and new users wait for
      # approval.
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: pending
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
    volumes:
      - openwebui:/app/backend/data
    depends_on:
      gateway: { condition: service_started }
      ocr: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    networks: [frontend, ocr-ui]

  # --- optional: self-hosted LLM (docker compose --profile local-llm up -d) --
  # llama.cpp server (MIT). Put a GGUF file into LOCAL_LLM_MODEL_DIR and set
  # LOCAL_LLM_GGUF; see README "Local LLM". Not run in this repository (the
  # image registry and model weights were not reachable from the build
  # environment). For an NVIDIA GPU use the server-cuda image and a GPU
  # reservation in docker-compose.override.yml.
  local-llm:
    <<: *defaults
    profiles: [local-llm]
    image: ${LOCAL_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11749}
    environment:
      LLAMA_ARG_MODEL: /models/${LOCAL_LLM_GGUF:-model.gguf}
      LLAMA_ARG_ALIAS: local-llm
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LLAMA_ARG_CTX_SIZE: ${LOCAL_LLM_CTX:-8192}
      LLAMA_ARG_N_PARALLEL: ${LOCAL_LLM_PARALLEL:-1}
      LLAMA_ARG_OFFLINE: "true"
      LLAMA_ARG_UI: "false"
      LLAMA_ARG_ENDPOINT_SLOTS: "false"
    volumes:
      - ${LOCAL_LLM_MODEL_DIR:-./models/llm}:/models:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [providers]

  # --- optional: Surya OCR model server (docker compose --profile surya) -----
  # NVIDIA GPU (Ampere or newer for bfloat16) and the surya-ocr-2 weights in
  # SURYA_MODEL_DIR. The weights licence restricts commercial use: read
  # docs/LIMITATIONS.md before enabling. Not run in this repository.
  surya-vlm:
    <<: *defaults
    profiles: [surya]
    image: vllm/vllm-openai:v0.20.1
    command:
      - --model=/models/surya-ocr-2
      - --served-model-name=datalab-to/surya-ocr-2
      - --dtype=${SURYA_VLLM_DTYPE:-bfloat16}
      - --max-model-len=18000
      - --gpu-memory-utilization=${SURYA_VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      - --enable-prefix-caching
      - '--mm-processor-kwargs={"min_pixels": 3136, "max_pixels": 6291456}'
    environment:
      VLLM_API_KEY: ${SURYA_VLM_API_KEY:-}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${SURYA_MODEL_DIR:-./models/surya}:/models:ro
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [ocr-model]

volumes:
  pgdata:
  openwebui:

networks:
  # No internet egress on these:
  data: { internal: true }
  analysis: { internal: true }
  providers: { internal: true }
  internal: { internal: true }
  # OCR service <-> Open WebUI / gateway / optional Surya model server, kept
  # apart so that none of the three can reach another through the OCR network.
  ocr-ui: { internal: true }
  ocr-gateway: { internal: true }
  ocr-model: { internal: true }
  # LiteLLM only: reach real LLM providers.
  egress: {}
  # Published ports (gateway, Open WebUI).
  frontend: {}
